services:
  http:
    build:
      context: ./src
      args:
        SERVICE: http
    image: chess-arena-http
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://chess:chess@db:5432/chess_arena?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  ws:
    build:
      context: ./src
      args:
        SERVICE: ws
    image: chess-arena-ws
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://chess:chess@db:5432/chess_arena?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    image: chess-arena-db
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_arena
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_arena"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
